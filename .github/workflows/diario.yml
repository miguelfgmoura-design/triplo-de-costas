name: Atualização diária

# Corre sozinho todas as manhãs e também à mão, no botão "Run workflow".
# Nunca corre em pull requests de terceiros, porque o repositório é público.
on:
  # O GitHub não cumpre as horas marcadas. Neste projeto, cada linha do
  # agendamento só dispara umas 7 horas depois da hora marcada, e uma linha que
  # se repete (de hora a hora, por exemplo) só volta a contar depois de a
  # tentativa anterior chegar, o que dava 3 ou 4 tentativas por dia.
  # Por isso há uma linha para cada 20 minutos do dia, cada uma com a sua hora:
  # seja qual for o atraso, chega sempre alguma pouco depois das 9h de Lisboa.
  # O primeiro passo só deixa trabalhar a primeira que chegar depois das 9h;
  # as outras acabam em segundos, sem fazer nada. Horas de Londres (UTC).
  schedule: [
    {cron: "4 0 * * *"}, {cron: "24 0 * * *"}, {cron: "44 0 * * *"},
    {cron: "4 1 * * *"}, {cron: "24 1 * * *"}, {cron: "44 1 * * *"},
    {cron: "4 2 * * *"}, {cron: "24 2 * * *"}, {cron: "44 2 * * *"},
    {cron: "4 3 * * *"}, {cron: "24 3 * * *"}, {cron: "44 3 * * *"},
    {cron: "4 4 * * *"}, {cron: "24 4 * * *"}, {cron: "44 4 * * *"},
    {cron: "4 5 * * *"}, {cron: "24 5 * * *"}, {cron: "44 5 * * *"},
    {cron: "4 6 * * *"}, {cron: "24 6 * * *"}, {cron: "44 6 * * *"},
    {cron: "4 7 * * *"}, {cron: "24 7 * * *"}, {cron: "44 7 * * *"},
    {cron: "4 8 * * *"}, {cron: "24 8 * * *"}, {cron: "44 8 * * *"},
    {cron: "4 9 * * *"}, {cron: "24 9 * * *"}, {cron: "44 9 * * *"},
    {cron: "4 10 * * *"}, {cron: "24 10 * * *"}, {cron: "44 10 * * *"},
    {cron: "4 11 * * *"}, {cron: "24 11 * * *"}, {cron: "44 11 * * *"},
    {cron: "4 12 * * *"}, {cron: "24 12 * * *"}, {cron: "44 12 * * *"},
    {cron: "4 13 * * *"}, {cron: "24 13 * * *"}, {cron: "44 13 * * *"},
    {cron: "4 14 * * *"}, {cron: "24 14 * * *"}, {cron: "44 14 * * *"},
    {cron: "4 15 * * *"}, {cron: "24 15 * * *"}, {cron: "44 15 * * *"},
    {cron: "4 16 * * *"}, {cron: "24 16 * * *"}, {cron: "44 16 * * *"},
    {cron: "4 17 * * *"}, {cron: "24 17 * * *"}, {cron: "44 17 * * *"},
    {cron: "4 18 * * *"}, {cron: "24 18 * * *"}, {cron: "44 18 * * *"},
    {cron: "4 19 * * *"}, {cron: "24 19 * * *"}, {cron: "44 19 * * *"},
    {cron: "4 20 * * *"}, {cron: "24 20 * * *"}, {cron: "44 20 * * *"},
    {cron: "4 21 * * *"}, {cron: "24 21 * * *"}, {cron: "44 21 * * *"},
    {cron: "4 22 * * *"}, {cron: "24 22 * * *"}, {cron: "44 22 * * *"},
    {cron: "4 23 * * *"}, {cron: "24 23 * * *"}, {cron: "44 23 * * *"}
  ]
  workflow_dispatch:
    inputs:
      simular_falha:
        description: "Simular uma falha, para testar"
        type: choice
        default: nenhuma
        options:
          - nenhuma
          - comentario
          - espn

permissions: {}

concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  decidir:
    name: Ver se a atualização ainda falta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
      hora: ${{ steps.ver.outputs.hora }}
      verificacao: ${{ steps.ver.outputs.verificacao }}
    steps:
      # Vai buscar sempre a versão mais recente, para ver o que a tentativa anterior já fez.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - id: ver
        env:
          EVENTO: ${{ github.event_name }}
          LINHA: ${{ github.event.schedule }}
        run: |
          hora=$(TZ=Europe/Lisbon date +%-H)
          echo "hora=$hora" >> "$GITHUB_OUTPUT"
          if [ "$EVENTO" != "schedule" ]; then
            echo "Pedido feito à mão: corre sempre."
            echo "correr=sim" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Serve para medir o atraso do GitHub: a que horas estava marcada e a que horas chegou.
          echo "Tentativa marcada com a linha: $LINHA (hora de Londres). Chegou às $(TZ=Europe/Lisbon date +%H:%M) de Lisboa."
          codigo=0
          python src/ja_atualizado.py || codigo=$?
          if [ "$codigo" -eq 0 ]; then
            echo "correr=nao" >> "$GITHUB_OUTPUT"
          elif [ "$codigo" -eq 10 ]; then
            echo "correr=sim" >> "$GITHUB_OUTPUT"
          elif [ "$hora" -eq 9 ]; then
            # A verificação avariou. Na dúvida corre, mas só nesta hora, para
            # não repetir a atualização em todas as tentativas do dia.
            echo "::warning::A verificação inicial avariou (código $codigo). A atualização corre na mesma."
            echo "correr=sim" >> "$GITHUB_OUTPUT"
            echo "verificacao=falhou" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::A verificação inicial avariou (código $codigo). Fica para as tentativas das 9h."
            echo "correr=nao" >> "$GITHUB_OUTPUT"
          fi

  atualizar:
    name: Atualizar os dados e gerar o site
    needs: decidir
    if: needs.decidir.outputs.correr == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      dados: ${{ steps.dados.outcome }}
      blocos: ${{ steps.verificar.outputs.blocos }}
      guardar: ${{ steps.guardar.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Fica apontado que esta tentativa começou. Se ela não chegar ao fim, as
      # seguintes esperam antes de repetir (ver src/ja_atualizado.py).
      - name: Apontar a tentativa
        continue-on-error: true
        run: python src/ja_atualizado.py --registar

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Recolher os dados da ESPN e calcular as estatísticas
        id: dados
        continue-on-error: true
        env:
          SIMULAR: ${{ inputs.simular_falha }}
        run: |
          if [ "$SIMULAR" = "espn" ]; then
            echo "Falha da ESPN simulada."
            exit 2
          fi
          python src/recolher.py
          python src/calcular.py

      - name: Verificar os blocos de estatísticas
        id: verificar
        if: steps.dados.outcome == 'success'
        run: |
          if grep -q '"erro": true' dados/stats.json; then
            echo "blocos=falhou" >> "$GITHUB_OUTPUT"
          else
            echo "blocos=ok" >> "$GITHUB_OUTPUT"
          fi

      # O Claude não tem ferramentas nenhumas neste passo: sem comandos, sem
      # internet e sem acesso a ficheiros. Só recebe os números e devolve texto.
      - name: Escrever o comentário com o Claude
        id: comentario
        if: steps.dados.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          SIMULAR: ${{ inputs.simular_falha }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$SIMULAR" = "comentario" ]; then
            echo "Falha do comentário simulada."
            exit 3
          fi
          # Ao copiar o token é fácil ficar uma quebra de linha a meio. Aqui é removida.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          export CLAUDE_CODE_OAUTH_TOKEN
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          python src/pedido_comentario.py > "$RUNNER_TEMP/pedido.txt"
          pasta_vazia="$(mktemp -d)"
          cd "$pasta_vazia"
          if ! "$HOME/.local/bin/claude" -p --tools "" --max-turns 1 --no-session-persistence --strict-mcp-config \
            < "$RUNNER_TEMP/pedido.txt" > "$RUNNER_TEMP/comentario.md"; then
            echo "O Claude devolveu este erro:"
            head -c 600 "$RUNNER_TEMP/comentario.md"
            exit 1
          fi
          mv "$RUNNER_TEMP/comentario.md" "$GITHUB_WORKSPACE/dados/comentario.md"

      - name: Gerar o site
        env:
          DADOS: ${{ steps.dados.outcome }}
        run: |
          if [ "$DADOS" = "success" ]; then
            python src/gerar_site.py
          else
            python src/gerar_site.py --dados-antigos
          fi

      - name: Preparar a publicação
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Corre mesmo que um passo anterior falhe, para o apontamento da tentativa ficar guardado.
      - name: Guardar os dados no repositório
        id: guardar
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem alterações para guardar."
          else
            git commit -m "Dados de $(TZ=Europe/Lisbon date +%F)"
            git pull --rebase
            git push
          fi

  publicar:
    name: Publicar o site
    needs: atualizar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5

  # O site já saiu nesta altura. Este passo só serve para o GitHub enviar o
  # email de falha quando houver alguma coisa a corrigir.
  avisar:
    name: Avisar se alguma coisa falhou
    needs: [decidir, atualizar, publicar]
    if: always() && needs.atualizar.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirmar o resultado
        env:
          DADOS: ${{ needs.atualizar.outputs.dados }}
          BLOCOS: ${{ needs.atualizar.outputs.blocos }}
          GUARDAR: ${{ needs.atualizar.outputs.guardar }}
          EVENTO: ${{ github.event_name }}
          HORA: ${{ needs.decidir.outputs.hora }}
          VERIFICACAO: ${{ needs.decidir.outputs.verificacao }}
        run: |
          problemas=0
          if [ "$VERIFICACAO" = "falhou" ]; then
            echo "::error::A verificação inicial avariou. A atualização correu na mesma, mas o código precisa de ser visto."
            problemas=1
          fi
          # O site saiu, mas tarde: o email serve para se saber que houve atraso.
          if [ "$EVENTO" = "schedule" ] && [ "${HORA:-0}" -ge 11 ]; then
            echo "::error::Esta atualização só correu depois das ${HORA}h de Lisboa: ou o agendamento do GitHub se atrasou, ou uma tentativa anterior não chegou ao fim."
            problemas=1
          fi
          if [ "$DADOS" != "success" ]; then
            echo "::error::A ESPN falhou. O site saiu com os dados anteriores e o aviso de dados de ontem."
            problemas=1
          fi
          if [ "$BLOCOS" = "falhou" ]; then
            echo "::error::Um bloco de estatísticas falhou e ficou indisponível no site."
            problemas=1
          fi
          if [ "$GUARDAR" != "success" ]; then
            echo "::error::Os dados de hoje não ficaram guardados no repositório."
            problemas=1
          fi
          exit "$problemas"
