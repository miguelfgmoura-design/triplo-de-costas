name: Atualização diária

# Corre sozinho todas as manhãs e também à mão, no botão "Run workflow".
# Nunca corre em pull requests de terceiros, porque o repositório é público.
on:
  schedule:
    # O GitHub entrega as corridas agendadas com horas de atraso (7 a 10 horas
    # nas primeiras manhãs), por isso não dá para confiar numa hora marcada.
    # Tenta de hora a hora; o primeiro passo só deixa avançar depois das 9h de
    # Lisboa e enquanto a atualização do dia faltar. As outras tentativas
    # acabam em segundos, sem fazer nada.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      simular_falha:
        description: "Simular uma falha, para testar"
        type: choice
        default: nenhuma
        options:
          - nenhuma
          - comentario
          - espn

permissions: {}

concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  decidir:
    name: Ver se a atualização ainda falta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
      hora: ${{ steps.ver.outputs.hora }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Na dúvida, corre: se esta verificação falhar, a atualização segue na mesma.
      - id: ver
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          echo "hora=$(TZ=Europe/Lisbon date +%-H)" >> "$GITHUB_OUTPUT"
          if [ "$EVENTO" = "schedule" ] && python src/ja_atualizado.py; then
            echo "correr=nao" >> "$GITHUB_OUTPUT"
          else
            echo "correr=sim" >> "$GITHUB_OUTPUT"
          fi

  atualizar:
    name: Atualizar os dados e gerar o site
    needs: decidir
    if: needs.decidir.outputs.correr == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      dados: ${{ steps.dados.outcome }}
      blocos: ${{ steps.verificar.outputs.blocos }}
      guardar: ${{ steps.guardar.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Recolher os dados da ESPN e calcular as estatísticas
        id: dados
        continue-on-error: true
        env:
          SIMULAR: ${{ inputs.simular_falha }}
        run: |
          if [ "$SIMULAR" = "espn" ]; then
            echo "Falha da ESPN simulada."
            exit 2
          fi
          python src/recolher.py
          python src/calcular.py

      - name: Verificar os blocos de estatísticas
        id: verificar
        if: steps.dados.outcome == 'success'
        run: |
          if grep -q '"erro": true' dados/stats.json; then
            echo "blocos=falhou" >> "$GITHUB_OUTPUT"
          else
            echo "blocos=ok" >> "$GITHUB_OUTPUT"
          fi

      # O Claude não tem ferramentas nenhumas neste passo: sem comandos, sem
      # internet e sem acesso a ficheiros. Só recebe os números e devolve texto.
      - name: Escrever o comentário com o Claude
        id: comentario
        if: steps.dados.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          SIMULAR: ${{ inputs.simular_falha }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$SIMULAR" = "comentario" ]; then
            echo "Falha do comentário simulada."
            exit 3
          fi
          # Ao copiar o token é fácil ficar uma quebra de linha a meio. Aqui é removida.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          export CLAUDE_CODE_OAUTH_TOKEN
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          python src/pedido_comentario.py > "$RUNNER_TEMP/pedido.txt"
          pasta_vazia="$(mktemp -d)"
          cd "$pasta_vazia"
          if ! "$HOME/.local/bin/claude" -p --tools "" --max-turns 1 --no-session-persistence --strict-mcp-config \
            < "$RUNNER_TEMP/pedido.txt" > "$RUNNER_TEMP/comentario.md"; then
            echo "O Claude devolveu este erro:"
            head -c 600 "$RUNNER_TEMP/comentario.md"
            exit 1
          fi
          mv "$RUNNER_TEMP/comentario.md" "$GITHUB_WORKSPACE/dados/comentario.md"

      - name: Gerar o site
        env:
          DADOS: ${{ steps.dados.outcome }}
        run: |
          if [ "$DADOS" = "success" ]; then
            python src/gerar_site.py
          else
            python src/gerar_site.py --dados-antigos
          fi

      - name: Preparar a publicação
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Guardar os dados no repositório
        id: guardar
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem alterações para guardar."
          else
            git commit -m "Dados de $(TZ=Europe/Lisbon date +%F)"
            git pull --rebase
            git push
          fi

  publicar:
    name: Publicar o site
    needs: atualizar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5

  # O site já saiu nesta altura. Este passo só serve para o GitHub enviar o
  # email de falha quando houver alguma coisa a corrigir.
  avisar:
    name: Avisar se alguma coisa falhou
    needs: [decidir, atualizar, publicar]
    if: always() && needs.atualizar.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirmar o resultado
        env:
          DADOS: ${{ needs.atualizar.outputs.dados }}
          BLOCOS: ${{ needs.atualizar.outputs.blocos }}
          GUARDAR: ${{ needs.atualizar.outputs.guardar }}
          EVENTO: ${{ github.event_name }}
          HORA: ${{ needs.decidir.outputs.hora }}
        run: |
          problemas=0
          # O site saiu, mas tarde: o email serve para se saber que o GitHub se atrasou.
          if [ "$EVENTO" = "schedule" ] && [ "${HORA:-0}" -ge 11 ]; then
            echo "::error::A atualização só saiu depois das ${HORA}h de Lisboa, por atraso do agendamento do GitHub."
            problemas=1
          fi
          if [ "$DADOS" != "success" ]; then
            echo "::error::A ESPN falhou. O site saiu com os dados anteriores e o aviso de dados de ontem."
            problemas=1
          fi
          if [ "$BLOCOS" = "falhou" ]; then
            echo "::error::Um bloco de estatísticas falhou e ficou indisponível no site."
            problemas=1
          fi
          if [ "$GUARDAR" != "success" ]; then
            echo "::error::Os dados de hoje não ficaram guardados no repositório."
            problemas=1
          fi
          exit "$problemas"
